<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">LawLink wheel logo preview</title>
  <desc id="desc">Preview sheet for a steering wheel shaped LawLink mark.</desc>
  <rect width="900" height="520" fill="#edf0f4"/>
  <rect x="42" y="40" width="816" height="440" rx="28" fill="#ffffff" stroke="#d8e1ea"/>
  <defs>
    <linearGradient id="wheel-bg" x1="14" y1="8" x2="82" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3f7"/>
    </linearGradient>
  </defs>
  <g transform="translate(104 106) scale(2.7)">
