    <circle cx="48" cy="48" r="28" fill="none" stroke="#0f1b2d" stroke-width="9"/>
    <path d="M48 55v20" fill="none" stroke="#0f1b2d" stroke-width="9" stroke-linecap="round"/>
    <path d="M42 52 28 64" fill="none" stroke="#0f1b2d" stroke-width="9" stroke-linecap="round"/>
    <path d="M54 52 68 64" fill="none" stroke="#0f1b2d" stroke-width="9" stroke-linecap="round"/>
