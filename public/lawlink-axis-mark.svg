<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">LawLink axis mark</title>
  <desc id="desc">Two symmetric linked rings around a central matter axis.</desc>
  <defs>
    <linearGradient id="axis-bg" x1="14" y1="8" x2="82" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3f7"/>
    </linearGradient>
  </defs>
  <rect x="7" y="7" width="82" height="82" rx="24" fill="url(#axis-bg)"/>
  <rect x="7.5" y="7.5" width="81" height="81" rx="23.5" fill="none" stroke="#d8e1ea"/>
  <rect x="20" y="31" width="36" height="34" rx="13" fill="none" stroke="#0f1b2d" stroke-width="9"/>
  <rect x="40" y="31" width="36" height="34" rx="13" fill="none" stroke="#0f1b2d" stroke-width="9"/>
  <rect x="40" y="34" width="16" height="28" rx="8" fill="#007b7f"/>
  <circle cx="48" cy="48" r="4.2" fill="#f7fbfb"/>
</svg>
